<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nat's Otter Raft</title>
<meta name="description" content="A cozy sea otter family floating, napping and holding paws.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="An ocean where five sea otters float, play and hold paws"></canvas>

  <header class="hud">
    <div class="left">
      <div class="brand"><span class="brand-otter" aria-hidden="true">🦦</span><h1>Nat's Otter Raft</h1></div>
      <button id="btnMusic" class="icon" type="button" aria-label="Music">🎵</button>
      <button id="btnMute" class="icon" type="button" aria-label="Sound">🔈</button>
    </div>
    <div class="right">
      <div class="stats">
        <div class="stat happy" title="Family happiness"><span aria-hidden="true">💕</span><span class="meter"><i id="happyFill"></i></span></div>
        <div class="stat" title="Hearts earned"><span aria-hidden="true">💗</span><b id="nHearts">0</b></div>
        <div class="stat" title="Rocks found"><span aria-hidden="true">🪨</span><b id="nRocks">0</b></div>
        <div class="stat" title="Shells found"><span aria-hidden="true">🐚</span><b id="nShells">0</b></div>
        <div class="stat" title="Shiny treasures"><span aria-hidden="true">✨</span><b id="nPearls">0</b></div>
      </div>
      <div class="next" id="nextUnlock"></div>
    </div>
  </header>

  <div id="toasts" aria-live="polite"></div>

  <p id="hint">Tap an otter to say hi · drag to scoop · hold for tummy rubs · tap the water</p>

  <nav class="controls" aria-label="Family actions">
    <button id="btnCall" class="primary" type="button"><span aria-hidden="true">🤝</span><span class="lbl">Call the Family</span></button>
    <button id="btnNap" type="button" aria-label="Nap Time" title="Nap Time"><span aria-hidden="true">🌙</span><span class="lbl">Nap Time</span></button>
    <button id="btnCheer" type="button" aria-label="Family Cheer" title="Family Cheer" hidden><span aria-hidden="true">🙌</span><span class="lbl">Family Cheer</span></button>
    <button id="btnFree" class="free" type="button" aria-label="Free Roam" title="Let everyone swim free" hidden><span aria-hidden="true">🌊</span><span class="lbl">Free Roam</span></button>
    <button id="btnJournal" class="icon" type="button" aria-label="Open the Raft Journal" title="Raft Journal">📔<i id="journalDot" hidden></i></button>
    <button id="btnAdventure" class="adv-go" type="button" aria-label="Adventure mode" title="Adventure: explore and fight bosses"><span aria-hidden="true">⚔️</span><span class="lbl">Adventure</span></button>
  </nav>

  <div id="journal" class="scrim" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="journalTitle">
      <div class="sheet-head">
        <h2 id="journalTitle">📔 Raft Journal</h2>
        <button id="btnClose" class="icon" type="button" aria-label="Close journal">✕</button>
      </div>
      <div id="journalBody"></div>
    </div>
  </div>
</div>

  <!-- ============ ADVENTURE MODE HUD ============ -->
  <div id="adv" class="adv" hidden>
    <div class="adv-hud">
      <div class="adv-row">
        <button id="advHome" class="adv-pill" type="button" title="Back to the cozy raft"><span aria-hidden="true">🏝️</span><span class="lbl">Raft</span></button>
        <div class="adv-res" id="advRes"></div>
        <button id="advMusic" class="adv-pill icon" type="button" aria-label="Music on or off" title="Music">🎵</button>
        <button id="advMute" class="adv-pill icon" type="button" aria-label="Sound on or off" title="Sound">🔈</button>
      </div>
      <div class="adv-row sub">
        <span id="advBiome" class="biome"></span>
        <div class="bossmeter"><i id="advMeterFill"></i><span id="advMeterLbl"></span></div>
      </div>
      <div id="advBossBar" class="bossbar" hidden>
        <div class="bb-top"><b id="bbName"></b><span id="bbTitle"></span><span id="bbMods"></span></div>
        <div class="bb-hp"><i id="bbGhost"></i><i id="bbFill"></i><span id="bbText"></span></div>
      </div>
    </div>
    <div class="adv-bottom">
      <div class="abil-row" id="advAbilities"></div>
      <div class="adv-main">
        <button id="advUpgrade" class="adv-pill up" type="button"><span aria-hidden="true">⬆️</span><span class="lbl">Upgrades</span><i id="advUpDot" class="dot" hidden></i></button>
        <button id="advTap" class="tap-btn" type="button" hidden>TAP<br>ATTACK</button>
        <button id="advUlt" class="ult-btn" type="button" aria-label="Grand Raft Supernova" hidden><i id="advUltFill"></i><span class="ui">🌟</span><b id="advUltLbl">0%</b></button>
      </div>
    </div>
    <div id="advSheet" class="scrim" hidden>
      <div class="sheet adv-sheet" role="dialog" aria-modal="true" aria-labelledby="advSheetTitle">
        <div class="sheet-head">
          <h2 id="advSheetTitle">⬆️ Otter Upgrades</h2>
          <button id="advSheetClose" class="icon" type="button" aria-label="Close upgrades">✕</button>
        </div>
        <div id="advSheetBody"></div>
      </div>
    </div>
    <div id="advCard" class="reward-card" hidden></div>
    <button id="advSkip" class="adv-pill skip" type="button" hidden>Skip ▸</button>
  </div>

<script src="js/util.js"></script>
<script src="js/art.js"></script>
<script src="js/family.js"></script>
<script src="js/audio.js"></script>
<script src="js/progress.js"></script>
<script src="js/world.js"></script>
<script src="js/otter.js"></script>
<script src="js/events.js"></script>
<script src="js/dance.js"></script>
<script src="js/adventure/config.js"></script>
<script src="js/adventure/assets.js"></script>
<script src="js/adventure/pool.js"></script>
<script src="js/adventure/upgrades.js"></script>
<script src="js/adventure/gear.js"></script>
<script src="js/adventure/scroller.js"></script>
<script src="js/adventure/entities.js"></script>
<script src="js/adventure/squad.js"></script>
<script src="js/adventure/boss.js"></script>
<script src="js/adventure/bosses.js"></script>
<script src="js/adventure/abilities.js"></script>
<script src="js/adventure/story.js"></script>
<script src="js/adventure/advui.js"></script>
<script src="js/adventure/adventure.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script>
  window.addEventListener('load', function () {
    window.game = new OR.Game(document.getElementById('game'));
  });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Star Dodger</title>
<style>
  html, body { margin:0; height:100%; background:#05060f; color:#e8ebff; overflow:hidden;
    font-family: system-ui, "Segoe UI", Roboto, sans-serif; user-select:none; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; background:#05060fcc; }
  #overlay.hidden { display:none; }
  #overlay h1 { font-size:48px; margin:0 0 8px; color:#ffcf5c; letter-spacing:.04em; }
  #overlay p { color:#9aa0d0; margin:6px 0; line-height:1.5; }
  .btn { margin-top:14px; padding:12px 26px; border-radius:999px; background:#ffcf5c; color:#05060f;
    font-weight:800; font-size:18px; border:0; cursor:pointer; }
  a.back { position:fixed; top:10px; left:12px; color:#9aa0d0; text-decoration:none; font-size:14px; z-index:2; }
</style>
</head>
<body>
<a class="back" href="index.html">← Games</a>
<canvas id="c"></canvas>
<div id="overlay">
  <div>
    <h1 id="ovTitle">Star Dodger</h1>
    <p id="ovText">Blast the invaders, grab power-ups, survive the waves.</p>
    <p><b>Controller:</b> stick/D-pad fly · A (hold) fire · B bomb · Menu pause<br>
       <b>Keyboard:</b> arrows/WASD fly · Space fire · X bomb · P pause<br>
       <b>Touch:</b> drag to fly (auto-fire) · two-finger tap = bomb</p>
    <button class="btn" id="startBtn">Press A / Enter to play</button>
  </div>
</div>
<script>
// ---------- input ----------
const keys = new Set(); let tapQueue = new Set(); let padPrev = {};
const KM = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down', KeyA:'left', KeyD:'right',
  KeyW:'up', KeyS:'down', Space:'fire', KeyX:'bomb', KeyB:'bomb', Enter:'start', KeyP:'start', Escape:'start' };
addEventListener('keydown', e => { const k = KM[e.code]; if (!k) return; e.preventDefault(); if (!keys.has(k)) tapQueue.add(k); keys.add(k); });
addEventListener('keyup', e => { const k = KM[e.code]; if (k) keys.delete(k); });
let touch = null;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.addEventListener('touchstart', e => { e.preventDefault();
  if (e.touches.length >= 2) tapQueue.add('bomb');
  const t = e.touches[0]; touch = { x: t.clientX, y: t.clientY, px: player.x, py: player.y }; });
cv.addEventListener('touchmove', e => { e.preventDefault(); if (!touch) return; const t = e.touches[0];
  player.x = touch.px + (t.clientX - touch.x) * 1.3; player.y = touch.py + (t.clientY - touch.y) * 1.3; });
cv.addEventListener('touchend', e => { if (!e.touches.length) touch = null; });
function readInput() {
  const pad = { x: 0, y: 0 };
  for (const p of (navigator.getGamepads ? navigator.getGamepads() : [])) {
    if (!p) continue;
    const b = i => !!(p.buttons[i] && p.buttons[i].pressed);
    let ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    if (Math.hypot(ax, ay) < 0.2) { ax = 0; ay = 0; }
    pad.x += ax + (b(15) ? 1 : 0) - (b(14) ? 1 : 0);
    pad.y += ay + (b(13) ? 1 : 0) - (b(12) ? 1 : 0);
    pad.fire ||= b(0) || b(7) || b(5); pad.bomb ||= b(1) || b(2); pad.start ||= b(9);
  }
  for (const k of ['bomb', 'start', 'fire']) if (pad[k] && !padPrev[k]) tapQueue.add(k);
  padPrev = pad;
  const taps = tapQueue; tapQueue = new Set();
  let x = pad.x + (keys.has('right') ? 1 : 0) - (keys.has('left') ? 1 : 0);
  let y = pad.y + (keys.has('down') ? 1 : 0) - (keys.has('up') ? 1 : 0);
  const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
  return { x, y, fire: keys.has('fire') || pad.fire || !!touch, taps };
}

// ---------- world ----------
let W, H;
function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', resize); resize();
const stars = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), z: Math.random() * 0.8 + 0.2 }));

let player, bullets, enemies, ebullets, parts, pickups, score, wave, waveTimer, state, shake, best;
best = +(localStorage.getItem('stardodger-best') || 0);

function reset() {
  player = { x: W / 2, y: H * 0.8, r: 14, lives: 3, inv: 2, cool: 0, power: 1, bombs: 2 };
  bullets = []; enemies = []; ebullets = []; parts = []; pickups = [];
  score = 0; wave = 0; waveTimer = 1; shake = 0; state = 'play';
  show(false);
}
function show(on, t, txt, btn) {
  const o = document.getElementById('overlay'); o.classList.toggle('hidden', !on);
  if (t) document.getElementById('ovTitle').textContent = t;
  if (txt) document.getElementById('ovText').textContent = txt;
  if (btn) document.getElementById('startBtn').textContent = btn;
}
document.getElementById('startBtn').onclick = reset;
state = 'menu';

function spawnWave() {
  wave++;
  const n = 5 + wave * 2;
  const kinds = wave < 3 ? ['drone'] : wave < 6 ? ['drone', 'zig', 'shooter'] : ['drone', 'zig', 'shooter', 'tank'];
  for (let i = 0; i < n; i++) {
    const kind = kinds[Math.random() * kinds.length | 0];
    const base = { drone: [14, 1, 90, '#ff5f6d'], zig: [13, 1, 120, '#6cf07d'], shooter: [16, 2, 70, '#b57bff'], tank: [24, 6, 45, '#ffa24d'] }[kind];
    enemies.push({ kind, x: 40 + Math.random() * (W - 80), y: -30 - i * 55, r: base[0], hp: base[1] + Math.floor(wave / 4),
      vy: base[2] * (1 + wave * 0.04), color: base[3], t: Math.random() * 6, fire: 1 + Math.random() * 2 });
  }
  if (wave % 5 === 0) enemies.push({ kind: 'boss', x: W / 2, y: -80, r: 48, hp: 40 + wave * 6, maxhp: 40 + wave * 6,
    vy: 40, color: '#ff3df2', t: 0, fire: 1 });
}
function boom(x, y, color, n = 16) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = 40 + Math.random() * 220;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.5, color }); }
}
function hitPlayer() {
  if (player.inv > 0) return;
  player.lives--; player.inv = 2; player.power = Math.max(1, player.power - 1); shake = 14;
  boom(player.x, player.y, '#7cf7c9', 30);
  if (player.lives <= 0) {
    state = 'over';
    if (score > best) { best = score; localStorage.setItem('stardodger-best', best); }
    show(true, 'Game Over', `Score ${score} · Wave ${wave} · Best ${best}`, 'Play again (A / Enter)');
  }
}
function bomb() {
  if (player.bombs <= 0) return;
  player.bombs--; shake = 20; ebullets = [];
  for (const e of enemies) { e.hp -= 8; boom(e.x, e.y, e.color, 8); }
  parts.push({ ring: true, x: player.x, y: player.y, life: 0.6, r: 0 });
}

// ---------- update ----------
function update(dt) {
  const inp = readInput();
  if (state !== 'play') {
    if (inp.taps.has('start') || inp.taps.has('fire')) {
      if (state === 'paused') { state = 'play'; show(false); } else reset();
    }
    return;
  }
  if (inp.taps.has('start')) { state = 'paused'; show(true, 'Paused', 'Ready when you are.', 'Resume (A / Menu)'); return; }
  if (inp.taps.has('bomb')) bomb();

  const sp = 380;
  player.x = Math.max(16, Math.min(W - 16, player.x + inp.x * sp * dt));
  player.y = Math.max(16, Math.min(H - 16, player.y + inp.y * sp * dt));
  player.inv = Math.max(0, player.inv - dt);
  player.cool -= dt;
  if (inp.fire && player.cool <= 0) {
    player.cool = 0.13;
    const spread = { 1: [0], 2: [-6, 6], 3: [-10, 0, 10], 4: [-14, -5, 5, 14] }[Math.min(player.power, 4)];
    for (const o of spread) bullets.push({ x: player.x + o, y: player.y - 16, vx: o * 6, vy: -720 });
  }

  if (!enemies.length) { waveTimer -= dt; if (waveTimer <= 0) { spawnWave(); waveTimer = 1.5; } }

  for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
  bullets = bullets.filter(b => b.y > -20 && !b.dead);

  for (const e of enemies) {
    e.t += dt;
    if (e.kind === 'boss') {
      e.y = Math.min(e.y + e.vy * dt, 110); e.x = W / 2 + Math.sin(e.t * 0.8) * (W * 0.3);
      e.fire -= dt;
      if (e.fire <= 0) { e.fire = 0.9;
        for (let a = 0; a < 12; a++) { const ang = a / 12 * 6.28 + e.t; ebullets.push({ x: e.x, y: e.y, vx: Math.cos(ang) * 160, vy: Math.sin(ang) * 160 }); } }
    } else {
      e.y += e.vy * dt;
      if (e.kind === 'zig') e.x += Math.sin(e.t * 3) * 160 * dt;
      if (e.kind === 'shooter' || e.kind === 'tank') {
        e.fire -= dt;
        if (e.fire <= 0 && e.y > 0) { e.fire = e.kind === 'tank' ? 1.2 : 2;
          const a = Math.atan2(player.y - e.y, player.x - e.x);
          ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 220, vy: Math.sin(a) * 220 }); }
      }
      if (e.y > H + 40) { e.y = -40; e.x = 40 + Math.random() * (W - 80); }
    }
    for (const b of bullets) if (!b.dead && Math.hypot(b.x - e.x, b.y - e.y) < e.r + 4) {
      b.dead = true; e.hp--; e.flash = 0.06;
    }
    if (Math.hypot(player.x - e.x, player.y - e.y) < e.r + player.r * 0.6) { hitPlayer(); if (e.kind !== 'boss') e.hp = 0; }
    e.flash = Math.max(0, (e.flash || 0) - dt);
  }
  for (const e of enemies) if (e.hp <= 0) {
    score += e.kind === 'boss' ? 2000 : e.kind === 'tank' ? 150 : 50;
    boom(e.x, e.y, e.color, e.kind === 'boss' ? 80 : 18); shake = Math.max(shake, e.kind === 'boss' ? 20 : 4);
    const roll = Math.random();
    if (e.kind === 'boss' || roll < 0.08) pickups.push({ x: e.x, y: e.y, kind: 'power' });
    else if (roll < 0.12) pickups.push({ x: e.x, y: e.y, kind: 'life' });
    else if (roll < 0.15) pickups.push({ x: e.x, y: e.y, kind: 'bomb' });
  }
  enemies = enemies.filter(e => e.hp > 0);

  for (const b of ebullets) { b.x += b.vx * dt; b.y += b.vy * dt;
    if (Math.hypot(b.x - player.x, b.y - player.y) < player.r * 0.5 + 4) { b.dead = true; hitPlayer(); } }
  ebullets = ebullets.filter(b => !b.dead && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);

  for (const p of pickups) { p.y += 90 * dt;
    if (Math.hypot(p.x - player.x, p.y - player.y) < 26) { p.dead = true; score += 100;
      if (p.kind === 'power') player.power = Math.min(4, player.power + 1);
      if (p.kind === 'life') player.lives = Math.min(5, player.lives + 1);
      if (p.kind === 'bomb') player.bombs = Math.min(5, player.bombs + 1); } }
  pickups = pickups.filter(p => !p.dead && p.y < H + 20);

  for (const p of parts) { p.life -= dt; if (p.ring) p.r += 1600 * dt; else { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; } }
  parts = parts.filter(p => p.life > 0);
  shake *= 0.9;
}

// ---------- draw ----------
function ship(x, y, r, color) {
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.8, y + r * 0.8); ctx.lineTo(x, y + r * 0.4); ctx.lineTo(x - r * 0.8, y + r * 0.8);
  ctx.closePath(); ctx.fill();
}
function draw(t) {
  ctx.setTransform(1, 0, 0, 1, (Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  ctx.fillStyle = '#05060f'; ctx.fillRect(-20, -20, W + 40, H + 40);
  for (const s of stars) { const y = (s.y * H + t * 0.06 * s.z) % H;
    ctx.fillStyle = `rgba(200,210,255,${s.z})`; ctx.fillRect(s.x * W, y, s.z * 2, s.z * 2); }
  if (state === 'menu') return;
  for (const p of pickups) {
    ctx.fillStyle = { power: '#ffcf5c', life: '#7cf7c9', bomb: '#ff5f6d' }[p.kind];
    ctx.beginPath(); ctx.arc(p.x, p.y, 11, 0, 7); ctx.fill();
    ctx.fillStyle = '#05060f'; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText({ power: 'P', life: '+', bomb: 'B' }[p.kind], p.x, p.y + 1);
  }
  ctx.fillStyle = '#fff6b0'; for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 8, 4, 14);
  ctx.fillStyle = '#ff7ad9'; for (const b of ebullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, 7); ctx.fill(); }
  for (const e of enemies) {
    const col = e.flash > 0 ? '#ffffff' : e.color;
    if (e.kind === 'boss') {
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 7); ctx.fill();
      ctx.fillStyle = '#05060f'; ctx.beginPath(); ctx.arc(e.x, e.y + 6, e.r * 0.45, 0, 7); ctx.fill();
      ctx.fillStyle = '#333'; ctx.fillRect(W * 0.2, 14, W * 0.6, 8);
      ctx.fillStyle = '#ff3df2'; ctx.fillRect(W * 0.2, 14, W * 0.6 * e.hp / e.maxhp, 8);
    } else {
      ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(Math.PI); ship(0, 0, e.r, col); ctx.restore();
    }
  }
  for (const p of parts) {
    if (p.ring) { ctx.strokeStyle = `rgba(255,255,255,${p.life})`; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.stroke(); }
    else { ctx.globalAlpha = Math.max(0, p.life * 1.5); ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); ctx.globalAlpha = 1; }
  }
  if (!(player.inv > 0 && Math.floor(t / 80) % 2)) {
    ctx.fillStyle = '#ffae3d'; ctx.beginPath(); ctx.arc(player.x, player.y + 16, 4 + Math.random() * 3, 0, 7); ctx.fill();
    ship(player.x, player.y, player.r, '#7cf7c9');
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#e8ebff'; ctx.font = 'bold 18px system-ui'; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillText(`${score}`, W - 14, 12);
  ctx.font = '14px system-ui';
  ctx.fillText(`Wave ${wave}  ·  Best ${best}`, W - 14, 36);
  ctx.textAlign = 'left';
  ctx.fillText(`${'♥'.repeat(player.lives)}   Bombs ${player.bombs}   Power ${player.power}`, 14, H - 28);
}

let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  update(dt); draw(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
